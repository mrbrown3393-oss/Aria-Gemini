<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0f1a">
<title>Aria</title>
<style>
:root{color-scheme:dark;--bg:#0b0f1a;--panel:#151b2b;--ink:#eef1f8;--dim:#9ba7bd;--glow:#6fd3c4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,system-ui,sans-serif}
main{max-width:620px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:18px;gap:12px}
h1{font-size:24px;margin:0;color:var(--glow)}#status{font-size:13px;color:var(--dim)}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.msg{padding:12px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.user{align-self:flex-end;background:#23413f;max-width:90%}.aria{align-self:flex-start;background:var(--panel);max-width:95%}
form{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid #30394c;border-radius:24px;padding:14px;background:var(--panel);color:var(--ink);font-size:16px}
button{border:0;border-radius:24px;padding:12px 16px;background:var(--glow);color:#06201c;font-weight:700;font-size:16px}
button:disabled{opacity:.5}#mic{background:#27354a;color:var(--ink)}small{color:var(--dim)}
</style>
</head>
<body><main><h1>Aria</h1><div id="status">Gemini voice assistant · checking server…</div><div id="log" aria-live="polite"><div class="msg aria">Hi, I’m Aria. Type a message or tap the microphone to speak.</div></div>
<form id="form"><input id="input" autocomplete="off" placeholder="Talk to Aria…" aria-label="Message"><button id="send">Send</button><button id="mic" type="button" aria-label="Use microphone">🎙</button></form><small>Your Gemini key stays in the local Python server.</small></main>
<script>
const $=id=>document.getElementById(id),log=$('log'),input=$('input'),sendBtn=$('send');
const history=[];
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
async function check(){try{const r=await fetch('/health');const d=await r.json();$('status').textContent=d.ok?'Connected · '+d.model+(d.api_key_configured?' · API key configured':' · API key missing'):'Server issue';}catch{$('status').textContent='Cannot reach local server. Is server.py running?';}}
check();
async function talk(text){if(!text.trim())return;add(text,'user');history.push({role:'user',content:text});input.value='';sendBtn.disabled=true;
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');const blocks=Array.isArray(d.content)?d.content:[];const answer=blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();if(!answer)throw Error('Aria received no text reply. Try again.');history.push({role:'assistant',content:blocks});add(answer,'aria');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.rate=1; speechSynthesis.speak(u);}}
catch(e){add('Error: '+e.message,'aria');}finally{sendBtn.disabled=false;input.focus();}}
$('form').addEventListener('submit',e=>{e.preventDefault();talk(input.value);});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').addEventListener('click',()=>{if(!SR){add('Voice recognition is not available in this browser. You can still type.','aria');return;}const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onresult=e=>{input.value=e.results[0][0].transcript;talk(input.value);};rec.onerror=()=>add('Microphone input failed. Check Safari microphone permission, or type your message.','aria');rec.start();});
</script></body></html>
